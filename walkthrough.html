<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>Hudson ADU Walkthrough</title>
<style>
/* Layout: the 3D view fills the screen; three small panels float over it. */
:root {
  --bg: #bfdcf0;
  --panel: rgba(251, 252, 253, 0.9);
  --ink: #1d2a38;
  --ink-soft: #566575;
  --rule: #c7d0d9;
  --accent: #5f7a4f;
  --body: "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --panel: rgba(22, 33, 44, 0.9); --ink: #e3eaf1; --ink-soft: #9fb0c0; --rule: #2f3e4e; --accent: #a9c596; color-scheme: dark; }
}
:root[data-theme="dark"] { --panel: rgba(22, 33, 44, 0.9); --ink: #e3eaf1; --ink-soft: #9fb0c0; --rule: #2f3e4e; --accent: #a9c596; color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.4; }
#view { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; outline: none; }
.hud { position: fixed; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; }
#where { top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; display: flex; flex-direction: column; gap: 1px; pointer-events: none; }
#where b { font-size: 15px; font-weight: 600; }
#where span { font-size: 12px; color: var(--ink-soft); }
#help { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; max-width: 520px; pointer-events: none; font-size: 13px; }
#help b { font-weight: 600; }
#jumps { top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(420px, calc(100% - 200px)); justify-content: flex-end; padding: 6px; }
#jumps button { font: inherit; font-size: 12.5px; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 4px; padding: 4px 9px; cursor: pointer; }
#jumps button:hover { border-color: var(--accent); color: var(--accent); }
#jumps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#dot { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255, 255, 255, 0.8); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45); pointer-events: none; }
@media (max-width: 560px) { #jumps { max-width: calc(100% - 32px); top: auto; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); right: 16px; left: 16px; justify-content: flex-start; } }
</style>

<canvas id="view" tabindex="0" aria-label="3D walkthrough of the proposed cottage"></canvas>
<div id="dot"></div>
<div class="hud" id="where"><b id="room">Front yard</b><span>Hudson ADU, proposed layout</span></div>
<div class="hud" id="jumps" role="group" aria-label="Jump to a room">
  <button type="button" data-j="yard">Front yard</button>
  <button type="button" data-j="porch">Front door</button>
  <button type="button" data-j="living">Living room</button>
  <button type="button" data-j="kitchen">Kitchen</button>
  <button type="button" data-j="dining">Dining</button>
  <button type="button" data-j="bath">Bathroom</button>
  <button type="button" data-j="primary">Primary bedroom</button>
  <button type="button" data-j="bed2">Bedroom 2</button>
  <button type="button" data-j="deck">Deck</button>
  <button type="button" data-j="rear">Rear yard</button>
</div>
<div class="hud" id="help"><b>Hold the left mouse button</b> to walk forward. <b>Move the mouse</b> to look around. Press Esc to free the mouse. <span id="msg"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var msg = document.getElementById('msg');
  if (!window.THREE) { msg.textContent = 'The 3D library did not load. Check the internet connection and reload.'; return; }

  // Feet. x = east, z = toward the front of the house, y = up. Plan origin is the outside rear-left corner.
  var F = 1.75, H = 9, P = F + H, PITCH = 7 / 12;
  var canvas = document.getElementById('view');
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfdcf0);
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  var camera = new THREE.PerspectiveCamera(70, 1, 0.1, 900);
  camera.rotation.order = 'YXZ';

  // Morning sun from the east: it lights the front and the deck side, and comes in through those windows.
  scene.add(new THREE.HemisphereLight(0xe6f0ff, 0xa89c8a, 0.6));
  var sun = new THREE.DirectionalLight(0xffe7c4, 1.1);
  sun.position.set(22 + 70, 72, 15 + 62);
  sun.target.position.set(22, 0, 15);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  sun.shadow.camera.left = -62; sun.shadow.camera.right = 62; sun.shadow.camera.top = 62; sun.shadow.camera.bottom = -62;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 320;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.06;
  scene.add(sun); scene.add(sun.target);
  scene.fog = new THREE.Fog(0xd5e4ef, 220, 800);
  // sky dome, pale at the horizon
  var skyGeo = new THREE.SphereGeometry(700, 24, 16), skyCol = [], sp = skyGeo.attributes.position;
  for (var si = 0; si < sp.count; si++) {
    var k = Math.max(0, Math.min(1, sp.getY(si) / 420)), c = new THREE.Color(0xe3eef5).lerp(new THREE.Color(0x5f9bd1), Math.pow(k, 0.6));
    skyCol.push(c.r, c.g, c.b);
  }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(skyCol, 3));
  var sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false }));
  sky.position.set(22, 0, 15); scene.add(sky);

  // ---------- textures ----------
  function tex(size, draw, rx, ry) {
    var c = document.createElement('canvas'); c.width = size[0]; c.height = size[1];
    draw(c.getContext('2d'), size[0], size[1]);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    return t;
  }
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  // mahogany planks: one tile is 4 ft square, boards about 5 inches wide
  var floorTex = tex([512, 512], function (g, w, h) {
    var rows = 10, rh = h / rows;
    for (var r = 0; r < rows; r++) {
      var x = -rnd() * w * 0.6;
      while (x < w) {
        var len = w * (0.45 + rnd() * 0.5);
        var k = rnd();
        g.fillStyle = 'rgb(' + Math.round(96 + k * 34) + ',' + Math.round(38 + k * 16) + ',' + Math.round(24 + k * 10) + ')';
        g.fillRect(x, r * rh, len, rh);
        g.strokeStyle = 'rgba(40,12,6,0.16)';
        for (var s = 0; s < 5; s++) { var yy = r * rh + 3 + rnd() * (rh - 6); g.beginPath(); g.moveTo(x, yy); g.lineTo(x + len, yy + (rnd() - 0.5) * 3); g.stroke(); }
        g.fillStyle = 'rgba(30,8,4,0.6)'; g.fillRect(x + len - 1, r * rh, 2, rh);
        x += len;
      }
      g.fillStyle = 'rgba(30,8,4,0.6)'; g.fillRect(0, r * rh, w, 1.5);
    }
  }, 0.25, 0.25);
  // lap siding: one tile is one 6-inch course
  var sidingTex = tex([8, 64], function (g, w, h) {
    g.fillStyle = '#656d73'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#6f777d'; g.fillRect(0, 0, w, 10);
    g.fillStyle = '#474e54'; g.fillRect(0, h - 7, w, 7);
  }, 1, 2);
  var deckTex = tex([64, 64], function (g, w, h) {
    g.fillStyle = '#8f6c54'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#5c4334'; g.fillRect(0, 0, w, 3);
  }, 1, 2);

  // dark gray quartz, after MSI Babylon Gray: one tile is 2 ft square
  var counterTex = tex([256, 256], function (g, w, h) {
    g.fillStyle = '#595c5e'; g.fillRect(0, 0, w, h);
    for (var i = 0; i < 900; i++) {
      g.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.06)';
      g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 10, 1 + rnd() * 4);
    }
  }, 0.5, 0.5);
  // beige porcelain with soft taupe and gold veining, after MSI Stile Taja Perla: one tile is 4 ft square
  function perla(grout) {
    return tex([512, 512], function (g, w, h) {
      g.fillStyle = '#e7dece'; g.fillRect(0, 0, w, h);
      for (var i = 0; i < 26; i++) {
        var x = rnd() * w, y = rnd() * h, len = 120 + rnd() * 380, ang = -0.5 + rnd() * 0.5;
        g.strokeStyle = rnd() > 0.3 ? 'rgba(170,150,122,' + (0.10 + rnd() * 0.16) + ')' : 'rgba(196,166,110,' + (0.10 + rnd() * 0.14) + ')';
        g.lineWidth = 1 + rnd() * 5; g.beginPath(); g.moveTo(x, y);
        for (var s = 0; s < 6; s++) { x += Math.cos(ang) * len / 6; y += Math.sin(ang) * len / 6 + (rnd() - 0.5) * 18; g.lineTo(x, y); }
        g.stroke();
      }
      if (grout) { g.fillStyle = 'rgba(150,140,125,0.9)'; [0, 256].forEach(function (p) { g.fillRect(p, 0, 2.5, h); g.fillRect(0, p, w, 2.5); }); }
    }, 0.25, 0.25);
  }

  function L(color, extra) { var o = { color: color, roughness: 0.9, metalness: 0 }; if (extra) for (var k in extra) o[k] = extra[k]; return new THREE.MeshStandardMaterial(o); }
  var M = {
    siding: L(0xffffff, { map: sidingTex }), gable: L(0x656d73, { side: THREE.DoubleSide }),
    wall: L(0xf3efe6), ceiling: L(0xfbfaf6), trim: L(0xffffff), white: L(0xf8f7f3, { roughness: 0.6 }), panel: L(0xe9e7e0, { roughness: 0.6 }),
    black: L(0x1b1b1b, { roughness: 0.5 }), steel: L(0xc2c6cb, { roughness: 0.35, metalness: 0.25 }), dark: L(0x2c2f33),
    // wall paint, earthy tones
    pOpen: L(0xd0c5b4), pPrimary: L(0xb39483), pBed2: L(0x95978a), pBath: L(0xacad97),
    glass: new THREE.MeshPhongMaterial({ color: 0xcfe6f2, transparent: true, opacity: 0.22, shininess: 90, side: THREE.DoubleSide, depthWrite: false }),
    floor: L(0xffffff, { map: floorTex, roughness: 0.45 }), deck: L(0xffffff, { map: deckTex }),
    concrete: L(0xb3b0a8), roof: L(0x474b50, { side: THREE.DoubleSide }), grass: L(0x7d9f69, { roughness: 1 }), path: L(0xc9c5bb),
    counter: L(0xffffff, { map: counterTex, roughness: 0.5 }), tile: L(0xffffff, { map: perla(false), roughness: 0.25 }),
    tileFloor: L(0xffffff, { map: perla(true), roughness: 0.4 }), basin: L(0xe2e2de, { roughness: 0.3 }), teak: L(0xa9794f), oak: L(0xc9a877, { roughness: 0.7 }),
    frontDoor: L(0x2f3a40), frontDoorPanel: L(0x27313a),
    linen: L(0xf4f2ec), blue: L(0x7f97a8), oat: L(0xcfc4b0), rust: L(0xb5694a), mirror: new THREE.MeshPhongMaterial({ color: 0xc9d6dc, shininess: 120 })
  };

  var colliders = [];
  function worldUV(geo, w, h, d) {
    var uv = geo.attributes.uv;
    for (var i = 0; i < 24; i++) {
      var f = Math.floor(i / 4), su = f < 2 ? d : w, sv = (f === 2 || f === 3) ? d : h;
      uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
    }
  }
  // Box from absolute coordinates. col = true makes it block walking.
  function B(x0, x1, y0, y1, z0, z1, m, col, parent) {
    var w = Math.abs(x1 - x0), h = Math.abs(y1 - y0), d = Math.abs(z1 - z0);
    var g = new THREE.BoxGeometry(w, h, d);
    if (!Array.isArray(m) && m.map) worldUV(g, w, h, d);
    var me = new THREE.Mesh(g, m);
    me.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    (parent || scene).add(me);
    if (col) colliders.push([Math.min(x0, x1), Math.max(x0, x1), Math.min(z0, z1), Math.max(z0, z1)]);
    return me;
  }
  function block(x0, x1, z0, z1) { colliders.push([x0, x1, z0, z1]); }
  function poly(pts, m) {
    var pos = [];
    for (var i = 1; i < pts.length - 1; i++) pos.push.apply(pos, pts[0].concat(pts[i], pts[i + 1]));
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, m));
  }
  function cyl(a, b, r, m) {
    var va = new THREE.Vector3(a[0], a[1], a[2]), vb = new THREE.Vector3(b[0], b[1], b[2]);
    var d = vb.clone().sub(va);
    var me = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 12), m);
    me.position.copy(va).add(vb).multiplyScalar(0.5);
    me.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    scene.add(me);
    return me;
  }

  // ---------- walls ----------
  // A wall runs along `axis` from a0 to a1 and occupies c0..c1 across. ops = openings {a,b,sill,head}.
  // lo / hi = paint for the face on the low-coordinate side and the high-coordinate side.
  function wall(axis, c0, c1, a0, a1, ops, m, col, lo, hi) {
    if (lo || hi) { lo = lo || m; hi = hi || m; m = axis === 'x' ? [m, m, m, m, hi, lo] : [hi, lo, m, m, m, m]; }
    function seg(a, b, y0, y1, cl) {
      if (b - a < 0.01 || y1 - y0 < 0.01) return;
      if (axis === 'x') B(a, b, y0, y1, c0, c1, m, cl); else B(c0, c1, y0, y1, a, b, m, cl);
    }
    var cur = a0;
    (ops || []).forEach(function (o) {
      seg(cur, o.a, F, P, col);
      if (o.sill > 0) seg(o.a, o.b, F, F + o.sill, col);
      seg(o.a, o.b, F + o.head, P, false);
      cur = o.b;
    });
    seg(cur, a1, F, P, col);
  }
  // Casing, and for windows the glass, meeting rail and mullions.
  function trim(axis, c0, c1, o) {
    var A = c0 - 0.05, Z = c1 + 0.05, y0 = F + (o.sill || 0), y1 = F + o.head, cm = (c0 + c1) / 2;
    function S(a, b, ya, yb, ca, cb, m) { if (axis === 'x') B(a, b, ya, yb, ca, cb, m); else B(ca, cb, ya, yb, a, b, m); }
    S(o.a - 0.28, o.a, y0, y1, A, Z, M.trim); S(o.b, o.b + 0.28, y0, y1, A, Z, M.trim);
    S(o.a - 0.28, o.b + 0.28, y1, y1 + 0.3, A, Z, M.trim);
    if (o.sill > 0) {
      S(o.a - 0.28, o.b + 0.28, y0 - 0.15, y0, A - 0.05, Z + 0.05, M.trim);
      S(o.a, o.b, y0, y1, cm - 0.02, cm + 0.02, M.glass);
      if (o.rail !== false) S(o.a, o.b, (y0 + y1) / 2 - 0.05, (y0 + y1) / 2 + 0.05, cm - 0.06, cm + 0.06, M.trim);
      (o.mull || []).forEach(function (mx) { S(mx - 0.08, mx + 0.08, y0, y1, cm - 0.06, cm + 0.06, M.trim); });
    }
  }
  function inner(axis, c0, c1, a0, a1, ops, lo, hi) { wall(axis, c0, c1, a0, a1, ops, M.wall, true, lo, hi); (ops || []).forEach(function (o) { trim(axis, c0, c1, o); }); }
  // Outside wall: a siding skin outside, the room's paint inside.
  function ext(axis, outer, dir, a0, a1, ops, paint) {
    var s = outer + dir * 0.12, e = outer + dir * 0.45;
    wall(axis, Math.min(outer, s), Math.max(outer, s), a0, a1, ops, M.siding, false);
    wall(axis, Math.min(s, e), Math.max(s, e), a0, a1, ops, M.wall, true, dir < 0 ? paint : null, dir > 0 ? paint : null);
    (ops || []).forEach(function (o) { trim(axis, Math.min(outer, e), Math.max(outer, e), o); });
  }
  function win(a, b, sill, head, extra) { var o = { a: a, b: b, sill: sill, head: head }; if (extra) for (var k in extra) o[k] = extra[k]; return o; }
  function door(a, b, head) { return { a: a, b: b, sill: 0, head: head || 6.67 }; }

  // outside walls
  ext('x', 0, 1, 0, 15.88, [win(9.9, 12.4, 2.67, 6.67)], M.pBed2);
  ext('x', 0, 1, 15.88, 28.13, [win(25.09, 27.09, 5, 7, { rail: false })], M.pBath);
  ext('x', 0, 1, 28.13, 44.33, [win(34.2, 40.2, 5, 7, { rail: false, mull: [37.2] })], M.pPrimary);
  ext('z', 0, 1, 0, 10.3, [win(3.5, 6.5, 1.67, 6.67)], M.pBed2);
  ext('z', 0, 1, 10.3, 24, [win(18.8, 21.8, 1.67, 6.67)], M.pOpen);
  ext('x', 24, -1, 0, 15.67, [win(3.6, 8.7, 2.67, 6.67, { mull: [6.15] }), door(12.15, 15.19)], M.pOpen);
  ext('z', 15.67, 1, 24, 30, [], M.pOpen);
  ext('x', 30, -1, 15.67, 28.34, [win(18.44, 20.44, 3.5, 7.5), win(20.77, 23.27, 3.5, 7.5), win(23.6, 25.6, 3.5, 7.5)], M.pOpen);
  ext('z', 28.34, -1, 12, 30, [win(14.9, 17.4, 2.67, 6.67), door(17.71, 20.71)], M.pOpen);
  ext('x', 12, -1, 28.34, 44.33, [door(32.5, 38.5, 8)], M.pPrimary);
  ext('z', 44.33, -1, 0, 12, [win(3.4, 8.6, 1.67, 6.67, { mull: [6.0] })], M.pPrimary);
  // inside walls: (…, paint on the low side, paint on the high side)
  inner('z', 15.67, 16.09, 0.45, 8.14, [], M.pBed2, M.pBath);
  inner('z', 15.67, 16.09, 8.14, 10.45, [], M.pBed2, M.pOpen);
  inner('z', 15.67, 16.09, 20.71, 24, [], M.pOpen, M.pOpen);
  inner('x', 20.71, 21.01, 16.09, 18.36, [], M.pOpen, M.pOpen);
  inner('z', 27.92, 28.34, 0.45, 8.14, [], M.pBath, M.pPrimary);
  inner('z', 27.92, 28.34, 8.14, 12, [door(8.35, 11.35)], M.pOpen, M.pPrimary);
  inner('x', 10.15, 10.45, 0.45, 15.67, [door(12.4, 15.4)], M.pBed2, M.pOpen);
  inner('x', 5.85, 6.2, 13.0, 15.67, [], null, M.pBed2);
  inner('x', 5.85, 6.2, 28.34, 31.2, [], null, M.pPrimary);
  inner('x', 7.95, 8.33, 16.09, 27.92, [door(20.29, 23.29)], M.pBath, M.pOpen);
  inner('x', 5.2, 5.48, 16.09, 19.14, [], M.pBath, null);
  inner('z', 18.84, 19.14, 5.48, 7.95, [], null, M.pBath);

  // foundation, floors, ceilings, corner boards
  [[0, 15.67, 0, 24], [15.67, 28.34, 0, 30], [28.34, 44.33, 0, 12]].forEach(function (r) {
    B(r[0], r[1], 0, F - 0.02, r[2], r[3], M.concrete);
    B(r[0] + 0.1, r[1] - 0.1, F - 0.1, F, r[2] + 0.1, r[3] - 0.1, M.floor);
    B(r[0] + 0.1, r[1] - 0.1, P - 0.05, P + 0.05, r[2] + 0.1, r[3] - 0.1, M.ceiling);
  });
  [[0, 0], [44.33, 0], [44.33, 12], [0, 24], [15.67, 30], [28.34, 30], [15.67, 24], [28.34, 12]].forEach(function (c) {
    B(c[0] - 0.2, c[0] + 0.2, F, P, c[1] - 0.2, c[1] + 0.2, M.trim);
  });

  // ---------- roof (from the elevations: 7 in 12 gables, 9 ft plate) ----------
  var top = P + 12 * PITCH, ey = P - 1.5 * PITCH;
  poly([[-1.2, ey, -1.5], [28.34, ey, -1.5], [28.34, top, 12], [-1.2, top, 12]], M.roof);
  poly([[-1.2, ey, 25.5], [15.67, ey, 25.5], [15.67, top, 12], [-1.2, top, 12]], M.roof);
  poly([[15.67, P, 24], [28.34, P, 24], [28.34, top, 12], [15.67, top, 12]], M.roof);
  poly([[0, P, 0], [0, P, 24], [0, top, 12]], M.gable);
  poly([[28.34, P, 0], [28.34, P, 24], [28.34, top, 12]], M.gable);
  function gable(axis, a0, a1, b0, b1, oh0, oh1, ohB, t0, t1) {
    var mid = (b0 + b1) / 2, tp = P + (b1 - b0) / 2 * PITCH, e = P - ohB * PITCH, A0 = a0 - oh0, A1 = a1 + oh1;
